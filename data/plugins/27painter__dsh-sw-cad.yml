description:
  en: Registers two MCP servers that drive the installed AutoCAD and SolidWorks desktop apps over COM on Windows, each advertising two meta-tools instead of its full tool catalog, plus two on-demand skills.
  zh: 注册两个 MCP 服务器，在 Windows 上通过 COM 驱动本机安装的 AutoCAD 与 SolidWorks，两者都只广告两个元工具而非完整工具表；另附两个按需加载的技能。
